---
- name: Close dangerous ports with host firewall
  hosts: linux_hosts
  become: true
  gather_facts: false

  vars:
    dangerous_ports:
      - 21
      - 23
      - 3306
      - 5432
      - 6379
      - 9200
      - 11211

  tasks:
    - name: Check ufw availability
      ansible.builtin.shell: command -v ufw
      changed_when: false
      failed_when: false
      register: ufw_binary

    - name: Check firewalld availability
      ansible.builtin.shell: command -v firewall-cmd
      changed_when: false
      failed_when: false
      register: firewalld_binary

    - name: Read ufw status
      ansible.builtin.command: ufw status
      changed_when: false
      failed_when: false
      register: ufw_status
      when: ufw_binary.rc == 0

    - name: Read firewalld status
      ansible.builtin.command: firewall-cmd --state
      changed_when: false
      failed_when: false
      register: firewalld_status
      when: firewalld_binary.rc == 0

    - name: Deny dangerous TCP ports with ufw
      ansible.builtin.command: "ufw deny {{ item }}/tcp"
      loop: "{{ dangerous_ports }}"
      when:
        - ufw_binary.rc == 0
        - "'Status: active' in (ufw_status.stdout | default(''))"

    - name: Deny dangerous UDP ports with ufw
      ansible.builtin.command: "ufw deny {{ item }}/udp"
      loop: "{{ dangerous_ports }}"
      when:
        - ufw_binary.rc == 0
        - "'Status: active' in (ufw_status.stdout | default(''))"

    - name: Remove dangerous TCP ports from firewalld runtime config
      ansible.builtin.command: "firewall-cmd --remove-port={{ item }}/tcp"
      changed_when: false
      failed_when: false
      loop: "{{ dangerous_ports }}"
      register: firewalld_remove_runtime
      when:
        - firewalld_binary.rc == 0
        - "(firewalld_status.stdout | default('')) == 'running'"

    - name: Remove dangerous TCP ports from firewalld permanent config
      ansible.builtin.command: "firewall-cmd --permanent --remove-port={{ item }}/tcp"
      changed_when: false
      failed_when: false
      loop: "{{ dangerous_ports }}"
      register: firewalld_remove_permanent
      when:
        - firewalld_binary.rc == 0
        - "(firewalld_status.stdout | default('')) == 'running'"

    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      when:
        - firewalld_binary.rc == 0
        - "(firewalld_status.stdout | default('')) == 'running'"

    - name: Warn when no active supported firewall was found
      ansible.builtin.debug:
        msg: "На хосте нет активного ufw/firewalld. Порты не закрыты: сначала настройте firewall."
      when:
        - not (ufw_binary.rc == 0 and 'Status: active' in (ufw_status.stdout | default('')))
        - not (firewalld_binary.rc == 0 and (firewalld_status.stdout | default('')) == 'running')
