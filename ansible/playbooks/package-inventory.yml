---
- name: Collect package inventory
  hosts: linux_hosts
  become: true
  gather_facts: true

  vars:
    package_report_dir: "{{ hcp_reports_dir | default(playbook_dir ~ '/../reports') }}"
    report_suffix: "{{ (report_run_id | default('run-' ~ lookup('pipe', 'date -u +%Y%m%dT%H%M%S%N'))) | regex_replace('[^A-Za-z0-9_.:-]', '_') }}"

  tasks:
    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ package_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build package inventory JSON
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json
        import os
        import re
        import shutil
        import socket
        import subprocess
        from datetime import datetime, timezone

        def run(command):
            try:
                completed = subprocess.run(command, check=False, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
                completed.stdout = completed.stdout.decode("utf-8", "replace") if isinstance(completed.stdout, bytes) else completed.stdout
                completed.stderr = completed.stderr.decode("utf-8", "replace") if isinstance(completed.stderr, bytes) else completed.stderr
                return completed.returncode, completed.stdout.strip(), completed.stderr.strip()
            except Exception as exc:
                return None, "", str(exc)

        def read_os_release():
            data = {}
            try:
                with open("/etc/os-release", encoding="utf-8", errors="replace") as handle:
                    for raw_line in handle:
                        if "=" not in raw_line:
                            continue
                        key, value = raw_line.rstrip("\n").split("=", 1)
                        data[key] = value.strip().strip('"')
            except OSError:
                pass
            return data

        def debian_packages():
            code, output, error = run(["dpkg-query", "-W", "-f=${db:Status-Abbrev}\t${binary:Package}\t${Version}\t${Architecture}\t${source:Package}\t${source:Version}\n"])
            packages = []
            if code != 0:
                return packages, error
            for line in output.splitlines():
                parts = line.split("\t")
                # Do not report packages that were removed but still have a
                # residual dpkg record (for example, "rc").  Those packages
                # are not executable code on the managed host and would
                # otherwise create false CVE findings.
                if not parts or len(parts[0]) < 2 or parts[0][1] != "i":
                    continue
                if len(parts) != 6 or not all(parts[1:]):
                    return packages, "Incomplete dpkg package/source metadata"
                packages.append({
                    "name": parts[1],
                    "version": parts[2],
                    "arch": parts[3] if len(parts) > 3 else "",
                    "manager": "dpkg",
                    "sourceName": parts[4],
                    "sourceVersion": parts[5],
                })
            return packages, ""

        def rpm_packages():
            code, output, error = run(["rpm", "-qa", "--qf", "%{NAME}\t%{EPOCHNUM}\t%{VERSION}-%{RELEASE}\t%{ARCH}\t%{SOURCERPM}\n"])
            packages = []
            if code != 0:
                return packages, error
            for line in output.splitlines():
                parts = line.split("\t")
                if len(parts) < 5:
                    return packages, "Incomplete RPM package metadata"
                epoch = parts[1]
                version = parts[2]
                source = re.match(r"^(.+)-([^-]+)-([^-]+)\.(?:src|nosrc)\.rpm$", parts[4])
                packages.append({
                    "name": parts[0],
                    "version": '{}:{}'.format(epoch, version) if epoch not in {"", "0", "(none)"} else version,
                    "arch": parts[3] if len(parts) > 3 else "",
                    "manager": "rpm",
                    "sourceName": source.group(1) if source else "",
                    "sourceVersion": (('{}:'.format(epoch) if epoch not in {"", "0", "(none)"} else "") + source.group(2) + "-" + source.group(3)) if source else "",
                })
            return packages, ""

        os_release = read_os_release()
        try:
            with open("/etc/astra_version", encoding="utf-8", errors="replace") as handle:
                astra_version = handle.read(256).strip() or None
        except OSError:
            astra_version = None
        if shutil.which("dpkg-query"):
            packages, error = debian_packages()
        elif shutil.which("rpm"):
            packages, error = rpm_packages()
        else:
            packages, error = [], "No supported package manager (dpkg/rpm) found"
        if not packages and not error:
            error = "Package inventory is empty"

        created_at = datetime.now(timezone.utc).isoformat()
        print(json.dumps({
            "schemaVersion": 1,
            "action": "packageInventory",
            "runId": os.environ.get("REPORT_RUN_ID"),
            "inventoryHost": os.environ.get("INVENTORY_HOST"),
            "auditId": "packages_" + datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S"),
            "createdAt": created_at,
            "hostname": socket.gethostname(),
            "os": os_release.get("PRETTY_NAME") or os_release.get("NAME") or "Unknown Linux",
            "profileId": "packages",
            "mode": "packages",
            "packageInventory": {
                "osRelease": os_release,
                "astraVersion": astra_version,
                "packageCount": len(packages),
                "manager": packages[0]["manager"] if packages else None,
                "error": error,
            },
            "summary": {
                "score": None,
                "high": 0,
                "medium": 0,
                "low": 0,
                "info": 0,
                "total": len(packages),
            },
            "findings": [],
            "packages": packages,
        }, ensure_ascii=True))
        PY
      args:
        executable: /bin/bash
      environment:
        REPORT_RUN_ID: "{{ report_suffix }}"
        INVENTORY_HOST: "{{ inventory_hostname }}"
      changed_when: false
      register: package_inventory

    - name: Save package inventory on control node
      ansible.builtin.copy:
        content: "{{ package_inventory.stdout }}"
        dest: "{{ package_report_dir }}/{{ inventory_hostname }}-packages-{{ report_suffix }}.json"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Show report path
      ansible.builtin.debug:
        msg: "Saved {{ package_report_dir }}/{{ inventory_hostname }}-packages-{{ report_suffix }}.json"
