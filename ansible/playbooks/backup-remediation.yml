---
- name: Back up the active firewall and verify rollback prerequisites
  hosts: linux_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Validate backup operation
      ansible.builtin.assert:
        that:
          - transaction_id is defined
          - remediation_action in ['closePort', 'blockIp']
          - not ansible_check_mode

    - name: Create a protected verified firewall backup
      ansible.builtin.include_tasks: ../tasks/firewall-operation.yml
      vars:
        hcp_firewall_argv: "{{ ['backup', '--transaction', transaction_id] }}"
