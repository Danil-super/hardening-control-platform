---
- name: Stop selected systemd service
  hosts: linux_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Validate service name
      ansible.builtin.assert:
        that:
          - service_name is defined
          - service_name is match('^[A-Za-z0-9_.@:-]{1,96}$')
        fail_msg: "Укажите корректное имя systemd-сервиса."

    - name: Stop selected service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: stopped
        enabled: false
      register: service_result

    - name: Show service response
      ansible.builtin.debug:
        msg: "Сервис {{ service_name }} остановлен и отключен: changed={{ service_result.changed }}"
