---
- name: Block source IP with host firewall
  hosts: linux_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Validate source IP
      ansible.builtin.assert:
        that:
          - block_ip is defined
          - block_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
        fail_msg: "Укажите block_ip в формате IPv4."

    - name: Check ufw availability
      ansible.builtin.shell: command -v ufw
      changed_when: false
      failed_when: false
      register: ufw_binary

    - name: Check firewalld availability
      ansible.builtin.shell: command -v firewall-cmd
      changed_when: false
      failed_when: false
      register: firewalld_binary

    - name: Read ufw status
      ansible.builtin.command: ufw status
      changed_when: false
      failed_when: false
      register: ufw_status
      when: ufw_binary.rc == 0

    - name: Read firewalld status
      ansible.builtin.command: firewall-cmd --state
      changed_when: false
      failed_when: false
      register: firewalld_status
      when: firewalld_binary.rc == 0

    - name: Require an active supported firewall
      ansible.builtin.assert:
        that:
          - >-
            (ufw_binary.rc == 0 and 'Status: active' in (ufw_status.stdout | default('')))
            or (firewalld_binary.rc == 0 and (firewalld_status.stdout | default('')) == 'running')
        fail_msg: "На хосте нет активного ufw/firewalld. Автоматическая блокировка IP остановлена без изменений."

    - name: Deny source IP with ufw
      ansible.builtin.command: "ufw deny from {{ block_ip }}"
      when:
        - ufw_binary.rc == 0
        - "'Status: active' in (ufw_status.stdout | default(''))"

    - name: Add firewalld rich rule for source IP
      ansible.builtin.command: "firewall-cmd --permanent --add-rich-rule=rule family=ipv4 source address={{ block_ip }} drop"
      changed_when: false
      failed_when: false
      when:
        - firewalld_binary.rc == 0
        - "(firewalld_status.stdout | default('')) == 'running'"

    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      when:
        - firewalld_binary.rc == 0
        - "(firewalld_status.stdout | default('')) == 'running'"
