---
- name: Block a source address without blocking the management connection
  hosts: linux_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Validate source address request
      ansible.builtin.assert:
        that: block_ip is defined

    - name: Read the actual SSH management endpoints before sudo
      ansible.builtin.command: printenv SSH_CONNECTION
      become: false
      register: hcp_ssh_connection
      changed_when: false
      check_mode: false

    - name: Require verified management endpoints
      ansible.builtin.assert:
        that: hcp_ssh_connection.stdout.split() | length == 4
        fail_msg: "Cannot verify the management SSH endpoints. Blocking stopped."

    - name: Execute or preview a source address deny
      ansible.builtin.include_tasks: ../tasks/firewall-operation.yml
      vars:
        hcp_firewall_argv: >-
          {{ ['blockIp', '--ip', block_ip,
              '--ssh-client', hcp_ssh_connection.stdout.split()[0],
              '--protected-ip', hcp_ssh_connection.stdout.split()[2]]
             + (['--check'] if ansible_check_mode else []) }}
