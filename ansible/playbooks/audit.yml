---
- name: Run HCP audit-only scan
  hosts: linux_hosts
  become: true
  gather_facts: false

  vars:
    agent_install_dir: "{{ hostvars[inventory_hostname].agent_install_dir | default('/opt/hcp-agent') }}"
    agent_report_dir: "{{ playbook_dir }}/../reports"

  tasks:
    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ agent_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Run audit-only agent
      ansible.builtin.command:
        cmd: "python3 {{ agent_install_dir }}/agent.py audit --profile {{ audit_profile | default('basic_linux') }} {{ audit_extra_args | default('') }}"
      changed_when: false
      register: audit_result

    - name: Save JSON report on control node
      ansible.builtin.copy:
        content: "{{ audit_result.stdout }}"
        dest: "{{ agent_report_dir }}/{{ inventory_hostname }}-{{ audit_profile | default('basic_linux') }}.json"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Show report path
      ansible.builtin.debug:
        msg: "Saved {{ agent_report_dir }}/{{ inventory_hostname }}-{{ audit_profile | default('basic_linux') }}.json"
