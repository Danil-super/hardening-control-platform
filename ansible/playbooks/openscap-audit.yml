---
- name: Evaluate an explicit OpenSCAP policy or bundled Astra baseline
  hosts: linux_hosts
  gather_facts: false
  become: true

  vars:
    scanner_report_dir: "{{ hcp_reports_dir | default(playbook_dir ~ '/../reports') }}"
    report_suffix: "{{ (report_run_id | default('run-' ~ lookup('pipe', 'date -u +%Y%m%dT%H%M%S%N'))) | regex_replace('[^A-Za-z0-9_.:-]', '_') }}"
    # The content and profile are deliberately explicit. Selecting a random
    # datastream from a host can produce a misleading compliance result.
    openscap_datastream: "{{ hcp_openscap_datastream | default(lookup('env', 'HCP_OPENSCAP_DATASTREAM'), true) }}"
    openscap_profile: "{{ hcp_openscap_profile | default(lookup('env', 'HCP_OPENSCAP_PROFILE'), true) }}"
    openscap_builtin_astra: "{{ openscap_datastream == '/__hcp_builtin__/astra-baseline.xml' }}"
    # Opt-in for older managed OpenSCAP engines that can evaluate a
    # source datastream but cannot assemble the same HCP source bundle.
    # Always compose + validate with oscap on the control node, then
    # compare the target's received SHA-256 before any evaluation.
    openscap_compose_on_controller: "{{ hcp_openscap_compose_on_controller | default(false) | bool }}"
    # Older target OpenSCAP may reject a modern controller-built SDS even
    # though the original XCCDF/OVAL/CPE files are schema-supported.
    # Explicit standalone evaluation still uses the unmodified 18 rules,
    # schema validation on BOTH controller and guest, and SHA256 per file.
    openscap_standalone_on_target: "{{ hcp_openscap_standalone_on_target | default(false) | bool }}"
    openscap_policy_group: "{{ hcp_openscap_policy_group | default('environment', true) }}"
    openscap_raw_report: "{{ scanner_report_dir }}/.{{ inventory_hostname }}-openscap-{{ report_suffix }}.xml"

  tasks:
    - name: Refuse an unverified standalone evaluation mode
      ansible.builtin.assert:
        that:
          - openscap_builtin_astra | bool
          - openscap_compose_on_controller | bool
        fail_msg: "Standalone form requires exact authored Astra content and controller-validated full SDS."
      when: openscap_standalone_on_target | bool

    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ scanner_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Explain missing OpenSCAP configuration without touching target
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ playbook_dir }}/../scripts/hcp-controller-scan.py"
          - openscap-unavailable
          - --inventory-host
          - "{{ inventory_hostname }}"
          - --run-id
          - "{{ report_suffix }}"
          - --reason
          - "Не заданы HCP_OPENSCAP_DATASTREAM и HCP_OPENSCAP_PROFILE."
          - --policy-group
          - "{{ openscap_policy_group }}"
          - --output
          - "{{ scanner_report_dir }}/{{ inventory_hostname }}-openscap-{{ report_suffix }}.json"
      delegate_to: localhost
      become: false
      changed_when: false
      when: (openscap_datastream | length) == 0 or (openscap_profile | length) == 0

    - name: Check OpenSCAP executable on target
      ansible.builtin.command:
        argv: ["/usr/bin/env", "sh", "-c", "command -v oscap"]
      changed_when: false
      failed_when: false
      register: openscap_binary
      when: (openscap_datastream | length) > 0 and (openscap_profile | length) > 0

    - name: Check explicit OpenSCAP content on target
      ansible.builtin.stat:
        path: "{{ openscap_datastream }}"
        checksum_algorithm: sha256
      register: openscap_content
      when:
        - (openscap_datastream | length) > 0 and (openscap_profile | length) > 0
        - not (openscap_builtin_astra | bool)

    - name: Explain unavailable OpenSCAP prerequisites
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ playbook_dir }}/../scripts/hcp-controller-scan.py"
          - openscap-unavailable
          - --inventory-host
          - "{{ inventory_hostname }}"
          - --run-id
          - "{{ report_suffix }}"
          - --reason
          - "{{ 'oscap не установлен на целевом хосте.' if (openscap_binary.rc | default(1)) != 0 else 'Контент OpenSCAP не является доступным обычным файлом: ' ~ openscap_datastream }}"
          - --profile
          - "{{ openscap_profile }}"
          - --datastream
          - "{{ openscap_datastream }}"
          - --policy-group
          - "{{ openscap_policy_group }}"
          - --output
          - "{{ scanner_report_dir }}/{{ inventory_hostname }}-openscap-{{ report_suffix }}.json"
      delegate_to: localhost
      become: false
      changed_when: false
      when:
        - (openscap_datastream | length) > 0 and (openscap_profile | length) > 0
        - (openscap_binary.rc | default(1)) != 0 or (not (openscap_builtin_astra | bool) and not (openscap_content.stat.isreg | default(false) | bool))

    - name: Run OpenSCAP and always remove temporary target files
      block:
        - name: Create temporary OpenSCAP directory on target
          ansible.builtin.tempfile:
            state: directory
            prefix: hcp-openscap-
          register: openscap_remote_dir

        - name: Copy the bundled read-only Astra baseline into the temporary directory
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../scap/astra/{{ item.name }}"
            dest: "{{ openscap_remote_dir.path }}/{{ item.name }}"
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - {name: astra-baseline.xml, mode: "0600"}
            - {name: check.py, mode: "0700"}
            - {name: astra-platform-oval.xml, mode: "0600"}
            - {name: astra-cpe-dictionary.xml, mode: "0600"}
          when: openscap_builtin_astra | bool

        - name: Identify the exact bundled sources independently of generated datastream timestamps
          ansible.builtin.command:
            argv:
              - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
              - -c
              - |
                import hashlib, os, sys
                names = ['astra-baseline.xml', 'check.py', 'astra-platform-oval.xml', 'astra-cpe-dictionary.xml']
                digest = hashlib.sha256()
                for name in sorted(names):
                    with open(os.path.join(sys.argv[1], name), 'rb') as source:
                        digest.update(name.encode('utf-8') + b'\0' + hashlib.sha256(source.read()).digest())
                print('bundle-sha256:' + digest.hexdigest())
              - "{{ openscap_remote_dir.path }}"
          register: openscap_bundle_identity
          changed_when: false
          when: openscap_builtin_astra | bool

        - name: Allocate an isolated control-node directory for precomposed Astra content
          ansible.builtin.tempfile:
            state: directory
            prefix: hcp-astra-sds-controller-
          register: openscap_controller_dir
          delegate_to: localhost
          become: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool

        - name: Copy unchanged HCP baseline and SCE/OVAL dependencies into controller build directory
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../scap/astra/{{ item.name }}"
            dest: "{{ openscap_controller_dir.path }}/{{ item.name }}"
            mode: "{{ item.mode }}"
          loop:
            - {name: astra-baseline.xml, mode: "0600"}
            - {name: check.py, mode: "0700"}
            - {name: astra-platform-oval.xml, mode: "0600"}
            - {name: astra-cpe-dictionary.xml, mode: "0600"}
          delegate_to: localhost
          become: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool

        - name: Compose the exact HCP Astra XCCDF/SCE source on the controller
          ansible.builtin.command:
            argv: [oscap, ds, sds-compose, "{{ openscap_controller_dir.path }}/astra-baseline.xml", "{{ openscap_controller_dir.path }}/astra-baseline-ds.xml"]
          register: openscap_controller_bundle
          delegate_to: localhost
          become: false
          failed_when: false
          changed_when: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool

        - name: Add the original HCP Astra applicability CPE dictionary on the controller
          ansible.builtin.command:
            argv: [oscap, ds, sds-add, astra-cpe-dictionary.xml, astra-baseline-ds.xml]
            chdir: "{{ openscap_controller_dir.path }}"
          register: openscap_controller_dictionary
          delegate_to: localhost
          become: false
          failed_when: false
          changed_when: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool
            - (openscap_controller_bundle.rc | default(1)) == 0

        - name: Require complete source datastream schema validation on the controller
          ansible.builtin.command:
            argv: [oscap, ds, sds-validate, "{{ openscap_controller_dir.path }}/astra-baseline-ds.xml"]
          register: openscap_controller_validation
          delegate_to: localhost
          become: false
          failed_when: false
          changed_when: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool
            - (openscap_controller_bundle.rc | default(1)) == 0
            - (openscap_controller_dictionary.rc | default(1)) == 0

        - name: Bundle the actual XCCDF and SCE script into one evaluated datastream
          ansible.builtin.command:
            argv:
              - oscap
              - ds
              - sds-compose
              - "{{ openscap_remote_dir.path }}/astra-baseline.xml"
              - "{{ openscap_remote_dir.path }}/astra-baseline-ds.xml"
          changed_when: false
          failed_when: false
          register: openscap_bundle
          when:
            - openscap_builtin_astra | bool
            - not (openscap_compose_on_controller | bool)

        - name: Add the native Astra family applicability dictionary
          ansible.builtin.command:
            argv: [oscap, ds, sds-add, astra-cpe-dictionary.xml, astra-baseline-ds.xml]
            chdir: "{{ openscap_remote_dir.path }}"
          changed_when: false
          failed_when: false
          register: openscap_dictionary
          when:
            - openscap_builtin_astra | bool
            - not (openscap_compose_on_controller | bool)
            - (openscap_bundle.rc | default(1)) == 0

        - name: Require schema validation of the complete native OVAL and SCE datastream
          ansible.builtin.command:
            argv: [oscap, ds, sds-validate, "{{ openscap_remote_dir.path }}/astra-baseline-ds.xml"]
          changed_when: false
          failed_when: false
          register: openscap_bundle_validation
          when:
            - openscap_builtin_astra | bool
            - not (openscap_compose_on_controller | bool)
            - (openscap_bundle.rc | default(1)) == 0
            - (openscap_dictionary.rc | default(1)) == 0

        - name: Record whether all content preparation gates passed
          ansible.builtin.set_fact:
            openscap_prepared: "{{ not (openscap_builtin_astra | bool) or ((((openscap_compose_on_controller | bool) and (openscap_controller_bundle.rc | default(1)) == 0 and (openscap_controller_dictionary.rc | default(1)) == 0 and (openscap_controller_validation.rc | default(1)) == 0)) or ((not (openscap_compose_on_controller | bool)) and (openscap_bundle.rc | default(1)) == 0 and (openscap_dictionary.rc | default(1)) == 0 and (openscap_bundle_validation.rc | default(1)) == 0)) }}"

        - name: Hash the source datastream already validated on the controller
          ansible.builtin.stat:
            path: "{{ openscap_controller_dir.path }}/astra-baseline-ds.xml"
            checksum_algorithm: sha256
          register: openscap_controller_built_file
          delegate_to: localhost
          become: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool
            - openscap_prepared | bool

        - name: Transfer only the schema-validated, original controller datastream to Astra
          ansible.builtin.copy:
            src: "{{ openscap_controller_dir.path }}/astra-baseline-ds.xml"
            dest: "{{ openscap_remote_dir.path }}/astra-baseline-ds.xml"
            owner: root
            group: root
            mode: "0600"
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool
            - openscap_prepared | bool
            - openscap_controller_built_file.stat.isreg | default(false) | bool


        - name: Check exact HCP authored standalone XML schemas on the actual target
          ansible.builtin.command:
            argv: [oscap, "{{ item.engine }}", validate, "{{ openscap_remote_dir.path }}/{{ item.source }}"]
          loop:
            - {engine: xccdf, source: astra-baseline.xml}
            - {engine: oval, source: astra-platform-oval.xml}
            - {engine: cpe, source: astra-cpe-dictionary.xml}
          register: openscap_standalone_target_validation
          changed_when: false
          failed_when: false
          no_log: true
          when:
            - openscap_builtin_astra | bool
            - openscap_standalone_on_target | bool
            - openscap_prepared | bool

        - name: Retain bounded target XML schema errors in private controller diagnostics only
          ansible.builtin.copy:
            content: "{{ {'schemaVersion': 1, 'validators': [
                {'kind': 'xccdf', 'exitCode': openscap_standalone_target_validation.results[0].rc | default(none),
                 'stdout': (openscap_standalone_target_validation.results[0].stdout | default(''))[:2048],
                 'stderr': (openscap_standalone_target_validation.results[0].stderr | default(''))[:2048]},
                {'kind': 'oval', 'exitCode': openscap_standalone_target_validation.results[1].rc | default(none),
                 'stdout': (openscap_standalone_target_validation.results[1].stdout | default(''))[:2048],
                 'stderr': (openscap_standalone_target_validation.results[1].stderr | default(''))[:2048]},
                {'kind': 'cpe', 'exitCode': openscap_standalone_target_validation.results[2].rc | default(none),
                 'stdout': (openscap_standalone_target_validation.results[2].stdout | default(''))[:2048],
                 'stderr': (openscap_standalone_target_validation.results[2].stderr | default(''))[:2048]}
              ]} | to_nice_json }}"
            dest: "{{ openscap_raw_report }}.standalone-diagnostics.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          when:
            - openscap_builtin_astra | bool
            - openscap_standalone_on_target | bool
            - hcp_openscap_keep_arf | default(false) | bool
            - openscap_standalone_target_validation is defined
            - openscap_standalone_target_validation.results | default([]) | length == 3

        - name: Hash all unchanged authored standalone components on the controller
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../scap/astra/{{ item }}"
            checksum_algorithm: sha256
          loop:
            - astra-baseline.xml
            - check.py
            - astra-platform-oval.xml
            - astra-cpe-dictionary.xml
          register: openscap_standalone_controller_hashes
          delegate_to: localhost
          become: false
          when:
            - openscap_builtin_astra | bool
            - openscap_standalone_on_target | bool
            - openscap_prepared | bool

        - name: Hash all copied authored standalone components on the target
          ansible.builtin.stat:
            path: "{{ openscap_remote_dir.path }}/{{ item }}"
            checksum_algorithm: sha256
          loop:
            - astra-baseline.xml
            - check.py
            - astra-platform-oval.xml
            - astra-cpe-dictionary.xml
          register: openscap_standalone_target_hashes
          when:
            - openscap_builtin_astra | bool
            - openscap_standalone_on_target | bool
            - openscap_prepared | bool

        - name: Prove four original standalone components are unchanged in transit
          ansible.builtin.assert:
            that:
              - openscap_standalone_controller_hashes.results | length == 4
              - openscap_standalone_target_hashes.results | length == 4
              - openscap_standalone_controller_hashes.results | selectattr('stat.isreg', 'equalto', true) | list | length == 4
              - openscap_standalone_target_hashes.results | selectattr('stat.isreg', 'equalto', true) | list | length == 4
              - openscap_standalone_controller_hashes.results | map(attribute='stat.checksum') | list == openscap_standalone_target_hashes.results | map(attribute='stat.checksum') | list
            fail_msg: "One or more original XCCDF/SCE/OVAL/CPE SHA-256 values differ; evaluation refused."
          when:
            - openscap_builtin_astra | bool
            - openscap_standalone_on_target | bool
            - openscap_prepared | bool

        - name: Require native schema acceptance for every standalone XML source
          ansible.builtin.set_fact:
            openscap_prepared: "{{ (openscap_prepared | bool) and (not (openscap_standalone_on_target | bool) or ((openscap_standalone_target_validation.results | default([]) | selectattr('rc', 'equalto', 0) | list | length) == 3)) }}"

        - name: Select the actual evaluation content
          ansible.builtin.set_fact:
            openscap_evaluation_content: "{{ (openscap_remote_dir.path ~ '/astra-baseline.xml') if (openscap_standalone_on_target | bool) else ((openscap_remote_dir.path ~ '/astra-baseline-ds.xml') if (openscap_builtin_astra | bool) else openscap_datastream) }}"

        - name: Fingerprint the actual content including bundled SCE code
          ansible.builtin.stat:
            path: "{{ openscap_evaluation_content }}"
            checksum_algorithm: sha256
          register: openscap_evaluated_content

        - name: Refuse to evaluate controller content changed in transit or absent on guest
          ansible.builtin.assert:
            that:
              - openscap_evaluated_content.stat.isreg | default(false) | bool
              - openscap_controller_built_file.stat.isreg | default(false) | bool
              - openscap_evaluated_content.stat.checksum == openscap_controller_built_file.stat.checksum
            fail_msg: "Schema-validated controller source checksum differs from guest. No OpenSCAP evaluation was performed."
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool
            - not (openscap_standalone_on_target | bool)
            - openscap_prepared | bool

        - name: Retain the exact compiled content only for explicitly requested audit evidence
          ansible.builtin.fetch:
            src: "{{ openscap_evaluation_content }}"
            dest: "{{ openscap_raw_report }}{{ '.evaluated-xccdf.xml' if (openscap_standalone_on_target | bool) else '.datastream.xml' }}"
            flat: true
          no_log: true
          when:
            - openscap_builtin_astra | bool
            - hcp_openscap_keep_arf | default(false) | bool
            - openscap_evaluated_content.stat.isreg | default(false) | bool
            - openscap_prepared | bool

        - name: Explain a failed built-in content preparation
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ playbook_dir }}/../scripts/hcp-controller-scan.py"
              - openscap-unavailable
              - --inventory-host
              - "{{ inventory_hostname }}"
              - --run-id
              - "{{ report_suffix }}"
              - --reason
              - "{{ 'Не удалось подготовить встроенный профиль Astra: compose=' ~ ((openscap_controller_bundle.rc | default('unknown') | string) if (openscap_compose_on_controller | bool) else (openscap_bundle.rc | default('unknown') | string)) ~ ', dictionary=' ~ ((openscap_controller_dictionary.rc | default('unknown') | string) if (openscap_compose_on_controller | bool) else (openscap_dictionary.rc | default('unknown') | string)) ~ ', validation=' ~ ((openscap_controller_validation.rc | default('unknown') | string) if (openscap_compose_on_controller | bool) else (openscap_bundle_validation.rc | default('unknown') | string)) ~ '; ' ~ (((openscap_controller_bundle.stderr | default('')) ~ (openscap_controller_dictionary.stderr | default('')) ~ (openscap_controller_validation.stderr | default('')))[:2000] if (openscap_compose_on_controller | bool) else (((openscap_bundle.stderr | default('')) ~ (openscap_dictionary.stderr | default('')) ~ (openscap_bundle_validation.stderr | default('')))[:2000])) ~ (('; standalone_rcs=' ~ (openscap_standalone_target_validation.results | default([]) | selectattr('rc', 'defined') | map(attribute='rc') | join(','))) if (openscap_standalone_on_target | bool) else '') }}"
              - --profile
              - "{{ openscap_profile }}"
              - --datastream
              - "{{ openscap_datastream }}"
              - --policy-group
              - "{{ openscap_policy_group }}"
              - --output
              - "{{ scanner_report_dir }}/{{ inventory_hostname }}-openscap-{{ report_suffix }}.json"
          delegate_to: localhost
          become: false
          changed_when: false
          when: not (openscap_evaluated_content.stat.isreg | default(false) | bool) or not (openscap_prepared | bool)


        - name: Inspect controller-validated SDS on target using read-only oscap info
          ansible.builtin.command:
            argv: [oscap, info, "{{ openscap_remote_dir.path }}/astra-baseline-ds.xml"]
          register: openscap_target_sds_info
          changed_when: false
          failed_when: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool
            - openscap_prepared | bool

        - name: Check controller-validated SDS schema with the target OpenSCAP engine
          ansible.builtin.command:
            argv: [oscap, ds, sds-validate, "{{ openscap_remote_dir.path }}/astra-baseline-ds.xml"]
          register: openscap_target_sds_validate
          changed_when: false
          failed_when: false
          when:
            - openscap_builtin_astra | bool
            - openscap_compose_on_controller | bool
            - openscap_prepared | bool

        - name: Evaluate normal complete SDS profile without remediation
          ansible.builtin.command:
            argv:
              - oscap
              - xccdf
              - eval
              - --profile
              - "{{ openscap_profile }}"
              - --results-arf
              - "{{ openscap_remote_dir.path }}/results.arf.xml"
              - "{{ openscap_evaluation_content }}"
          changed_when: false
          failed_when: false
          register: openscap_run_sds
          when:
            - not (openscap_standalone_on_target | bool)
            - openscap_evaluated_content.stat.isreg | default(false) | bool
            - openscap_prepared | bool

        - name: Evaluate the unchanged XCCDF profile with original CPE/OVAL/SCE sidecars on old OpenSCAP
          ansible.builtin.command:
            argv:
              - oscap
              - xccdf
              - eval
              - --cpe
              - "{{ openscap_remote_dir.path }}/astra-cpe-dictionary.xml"
              - --profile
              - "{{ openscap_profile }}"
              - --results-arf
              - "{{ openscap_remote_dir.path }}/results.arf.xml"
              - "{{ openscap_evaluation_content }}"
          changed_when: false
          failed_when: false
          register: openscap_run_standalone
          when:
            - openscap_standalone_on_target | bool
            - openscap_evaluated_content.stat.isreg | default(false) | bool
            - openscap_prepared | bool

        - name: Select actual OpenSCAP run record without inventing missing evaluations
          ansible.builtin.set_fact:
            openscap_run: "{{ openscap_run_standalone if (openscap_standalone_on_target | bool) else openscap_run_sds }}"

        - name: Check OpenSCAP ARF result
          ansible.builtin.stat:
            path: "{{ openscap_remote_dir.path }}/results.arf.xml"
          register: openscap_arf

        - name: Preserve native scanner failure diagnostics with explicitly requested raw evidence
          ansible.builtin.copy:
            content: "{{ {'exitCode': openscap_run.rc | default(none), 'stdout': (openscap_run.stdout | default(''))[:16000], 'stderr': (openscap_run.stderr | default(''))[:16000]} | to_nice_json }}"
            dest: "{{ openscap_raw_report }}.diagnostics.json"
            mode: "0600"
          delegate_to: localhost
          become: false
          no_log: true
          when:
            - hcp_openscap_keep_arf | default(false) | bool
            - openscap_run is defined and not (openscap_run.skipped | default(false) | bool)
            - (openscap_run.rc | default(1)) not in [0, 2] or not (openscap_arf.stat.exists | default(false) | bool)

        - name: Retrieve OpenSCAP ARF only when it was created
          ansible.builtin.fetch:
            src: "{{ openscap_remote_dir.path }}/results.arf.xml"
            dest: "{{ openscap_raw_report }}"
            flat: true
          when: openscap_arf.stat.exists | default(false) | bool
          no_log: true

        - name: Normalize OpenSCAP ARF on control node
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ playbook_dir }}/../scripts/hcp-controller-scan.py"
              - openscap-arf
              - --input
              - "{{ openscap_raw_report }}"
              - --inventory-host
              - "{{ inventory_hostname }}"
              - --run-id
              - "{{ report_suffix }}"
              - --exit-code
              - "{{ openscap_run.rc | default(1) | string }}"
              - --reason
              - "{{ (openscap_run.stderr | default(''))[:1400] ~ (('; target_info_rc=' ~ (openscap_target_sds_info.rc | default('unknown') | string) ~ '; target_schema_rc=' ~ (openscap_target_sds_validate.rc | default('unknown') | string)) if (openscap_compose_on_controller | bool) else '') }}"
              - --profile
              - "{{ openscap_profile }}"
              - --datastream
              - "{{ openscap_datastream }}"
              - --policy-group
              - "{{ openscap_policy_group }}"
              - --datastream-mtime
              - "{{ openscap_evaluated_content.stat.mtime | default('') | string }}"
              - --datastream-checksum
              - "{{ 'sha256:' ~ openscap_evaluated_content.stat.checksum if openscap_evaluated_content.stat.checksum is defined else '' }}"
              - --evaluation-form
              - "{{ 'original-standalone-xccdf' if (openscap_standalone_on_target | bool) else 'validated-source-datastream' }}"

              - --content-id
              - "{{ openscap_bundle_identity.stdout | default('') if openscap_builtin_astra | bool else '' }}"
              - --output
              - "{{ scanner_report_dir }}/{{ inventory_hostname }}-openscap-{{ report_suffix }}.json"
          delegate_to: localhost
          become: false
          changed_when: false
          when: openscap_run is defined and not (openscap_run.skipped | default(false) | bool)
      always:
        - name: Remove temporary OpenSCAP directory from target
          ansible.builtin.file:
            path: "{{ openscap_remote_dir.path }}"
            state: absent
          when: openscap_remote_dir is defined and openscap_remote_dir.path is defined

        - name: Remove temporary precomposed source directory from control node
          ansible.builtin.file:
            path: "{{ openscap_controller_dir.path }}"
            state: absent
          delegate_to: localhost
          become: false
          when:
            - openscap_controller_dir is defined
            - openscap_controller_dir.path is defined

        - name: Remove transient ARF from control node
          ansible.builtin.file:
            path: "{{ openscap_raw_report }}"
            state: absent
          delegate_to: localhost
          become: false
          # Explicit opt-in for acceptance/provenance workflows. ARF can
          # contain target configuration; ordinary audits still remove it.
          when: not (hcp_openscap_keep_arf | default(false) | bool)
      when:
        - (openscap_datastream | length) > 0 and (openscap_profile | length) > 0
        - (openscap_binary.rc | default(1)) == 0
        - (openscap_builtin_astra | bool) or (openscap_content.stat.isreg | default(false) | bool)
