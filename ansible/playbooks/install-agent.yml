---
- name: Install HCP audit-only agent
  hosts: linux_hosts
  become: true
  gather_facts: false

  vars:
    agent_install_dir: "{{ hostvars[inventory_hostname].agent_install_dir | default('/opt/hcp-agent') }}"

  tasks:
    - name: Create agent directory
      ansible.builtin.file:
        path: "{{ agent_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy audit-only agent
      ansible.builtin.copy:
        src: ../../agent/agent.py
        dest: "{{ agent_install_dir }}/agent.py"
        owner: root
        group: root
        mode: "0755"

    - name: Copy local bridge server
      ansible.builtin.copy:
        src: ../../agent/server.py
        dest: "{{ agent_install_dir }}/server.py"
        owner: root
        group: root
        mode: "0755"

    - name: Verify agent command
      ansible.builtin.command:
        cmd: "python3 {{ agent_install_dir }}/agent.py audit --profile {{ audit_profile | default('basic_linux') }}"
      changed_when: false
      register: audit_smoke

    - name: Show audit smoke result
      ansible.builtin.debug:
        msg: "Audit-only agent installed. Output bytes: {{ audit_smoke.stdout | length }}"
