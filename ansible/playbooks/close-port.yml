---
- name: Close a port with an explicit high-priority firewall deny
  hosts: linux_hosts
  become: true
  gather_facts: false
  tasks:
    - name: Validate port request
      ansible.builtin.assert:
        that:
          - target_port is defined
          - (target_port | string) is match('^[0-9]{1,5}$')
          - (target_protocol | default('tcp')) in ['tcp', 'udp']

    - name: Read the active SSH transport endpoint
      ansible.builtin.command: printenv SSH_CONNECTION
      become: false
      register: hcp_ssh_connection
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Execute or preview a port deny
      ansible.builtin.include_tasks: ../tasks/firewall-operation.yml
      vars:
        hcp_firewall_argv: >-
          {{ ['closePort', '--port', target_port | string,
              '--protocol', target_protocol | default('tcp'),
              '--ssh-port', (hcp_ssh_connection.stdout.split()[3] if hcp_ssh_connection.stdout.split() | length == 4 else ansible_port | default(22)) | string]
             + (['--check'] if ansible_check_mode else []) }}
