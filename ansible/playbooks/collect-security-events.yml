---
- name: Collect security events from Linux hosts
  hosts: linux_hosts
  become: true
  gather_facts: false

  vars:
    events_report_dir: "{{ hcp_reports_dir | default(playbook_dir ~ '/../reports') }}"
    report_suffix: "{{ (report_run_id | default('run-' ~ lookup('pipe', 'date -u +%Y%m%dT%H%M%S%N'))) | regex_replace('[^A-Za-z0-9_.:-]', '_') }}"

  tasks:
    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ events_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build security event summary
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
          - -c
          - "{{ lookup('file', playbook_dir ~ '/../scripts/hcp-security-events.py') }}"
      environment:
        REPORT_RUN_ID: "{{ report_suffix }}"
        INVENTORY_HOST: "{{ inventory_hostname }}"
      changed_when: false
      register: security_events

    - name: Save security event report on control node
      ansible.builtin.copy:
        content: "{{ security_events.stdout }}"
        dest: "{{ events_report_dir }}/{{ inventory_hostname }}-events-{{ report_suffix }}.json"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Show events report path
      ansible.builtin.debug:
        msg: "Saved {{ events_report_dir }}/{{ inventory_hostname }}-events-{{ report_suffix }}.json"
