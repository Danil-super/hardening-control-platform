---
- name: Collect security events from Linux hosts
  hosts: linux_hosts
  become: true
  gather_facts: false

  vars:
    events_report_dir: "{{ playbook_dir }}/../reports"

  tasks:
    - name: Ensure local report directory exists
      ansible.builtin.file:
        path: "{{ events_report_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Build security event summary
      ansible.builtin.shell: |
        python3 - <<'PY'
        import json
        import subprocess
        from datetime import datetime, timezone

        sources = {
            "auth_failed": "grep -Ei 'failed password|authentication failure|invalid user' /var/log/auth.log /var/log/secure 2>/dev/null | tail -n 30",
            "ufw_denied": "grep -Ei 'UFW BLOCK|UFW DENY' /var/log/syslog /var/log/ufw.log 2>/dev/null | tail -n 30",
            "suricata_fast": "tail -n 30 /var/log/suricata/fast.log 2>/dev/null",
            "suricata_eve": "grep -Ei 'alert|drop|blocked' /var/log/suricata/eve.json 2>/dev/null | tail -n 30",
            "kernel_network": "dmesg 2>/dev/null | grep -Ei 'denied|blocked|martian|syn flood' | tail -n 30",
        }

        events = []
        for source, command in sources.items():
            completed = subprocess.run(["bash", "-lc", command], check=False, capture_output=True, text=True, timeout=12)
            lines = [line for line in completed.stdout.splitlines() if line.strip()]
            for line in lines:
                events.append({"source": source, "message": line[:500]})

        severity = "high" if any(event["source"].startswith("suricata") for event in events) else "medium" if events else "info"
        print(json.dumps({
            "createdAt": datetime.now(timezone.utc).isoformat(),
            "mode": "events",
            "summary": {
                "total": len(events),
                "severity": severity,
                "sources": sorted(set(event["source"] for event in events)),
            },
            "events": events[:120],
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      changed_when: false
      register: security_events

    - name: Save security event report on control node
      ansible.builtin.copy:
        content: "{{ security_events.stdout }}"
        dest: "{{ events_report_dir }}/{{ inventory_hostname }}-events.json"
        mode: "0644"
      delegate_to: localhost
      become: false

    - name: Show events report path
      ansible.builtin.debug:
        msg: "Saved {{ events_report_dir }}/{{ inventory_hostname }}-events.json"
