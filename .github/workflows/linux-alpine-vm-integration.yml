name: Real Alpine OpenRC and APK acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/linux-alpine-vm-integration.yml
      - deployment/tests/verify_alpine_vm.py
      - deployment/tests/verify_linux_packages.mjs
      - deployment/tests/fixtures/linux-package-controls.json
      - ansible/playbooks/**
      - ansible/scripts/**
      - ansible/audit-rules/**
      - web/lib/linux-*.ts
      - web/lib/host-readiness.ts
      - web/lib/vulnerability-scan.ts
      - web/lib/trivy-output.ts
      - web/lib/ansible-reports.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/linux-alpine-vm-integration.yml
      - deployment/tests/verify_alpine_vm.py
      - deployment/tests/verify_linux_packages.mjs
      - deployment/tests/fixtures/linux-package-controls.json
      - ansible/playbooks/**
      - ansible/scripts/**
      - ansible/audit-rules/**
      - web/lib/linux-*.ts
      - web/lib/host-readiness.ts
      - web/lib/vulnerability-scan.ts
      - web/lib/trivy-output.ts
      - web/lib/ansible-reports.ts

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  alpine:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install controller and isolated VM tools
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          python -m pip install ansible-core==2.21.5
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          if test -e /dev/kvm; then sudo chmod 0666 /dev/kvm; fi
          npm ci --ignore-scripts --prefix web
          container=$(docker create aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb)
          docker cp "$container:/usr/local/bin/trivy" "$RUNNER_TEMP/trivy"
          docker rm "$container"
          chmod 755 "$RUNNER_TEMP/trivy"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Verify genuine OpenRC host and production scanner paths
        run: python deployment/tests/verify_alpine_vm.py --work-dir "$RUNNER_TEMP/hcp-alpine"
      - name: Save public acceptance evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-openrc-apk-acceptance
          path: ${{ runner.temp }}/hcp-alpine/artifacts/
          retention-days: 14
          if-no-files-found: warn
