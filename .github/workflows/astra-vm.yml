name: Real Astra VM scanner acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/astra-vm.yml
      - deployment/astra-vm/**
      - deployment/tests/verify_astra_vm*
      - deployment/tests/test_astra_vm.py
      - deployment/tests/measure_astra_baseline.py
      - deployment/tests/test_measure_astra_baseline.py
      - web/lib/asset-report-publication.ts
      - web/lib/asset-binding.ts
      - web/lib/state-store.ts
      - ansible/playbooks/**
      - ansible/scripts/hcp-oval-audit.py
      - ansible/scripts/hcp-controller-scan.py
      - ansible/scap/astra/**
      - web/lib/ansible-reports.ts
  pull_request:
    paths:
      - .github/workflows/astra-vm.yml
      - deployment/astra-vm/**
      - deployment/tests/verify_astra_vm*
      - deployment/tests/test_astra_vm.py
      - deployment/tests/measure_astra_baseline.py
      - deployment/tests/test_measure_astra_baseline.py
      - web/lib/asset-report-publication.ts
      - web/lib/asset-binding.ts
      - web/lib/state-store.ts
      - ansible/playbooks/**
      - ansible/scripts/hcp-oval-audit.py
      - ansible/scripts/hcp-controller-scan.py
      - ansible/scap/astra/**
      - web/lib/ansible-reports.ts

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  astra-vm:
    runs-on: ubuntu-24.04
    # Official 0.7 GiB images can be slow from the public publisher. The
    # download is still bounded and SHA-pinned; no mirrors or skips are used.
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        release: ["1.8.1", "1.8.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the production report normalizer dependencies
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Install VM and controller tools on the disposable runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ansible-core openscap-scanner
          if test -e /dev/kvm; then sudo chmod 0666 /dev/kvm; fi
      # Cache is keyed by the source manifest but never trusted as evidence:
      # the Python runner hashes the full file on every hit before using it.
      - name: Restore SHA-pinned publisher image cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hcp-pinned-astra-cache/${{ matrix.release }}
          key: hcp-astra-native-${{ matrix.release }}-${{ hashFiles('deployment/astra-vm/sources.json') }}
      - name: Boot genuine Astra and verify collection, baseline and vendor CVE controls
        env:
          HCP_ASTRA_IMAGE_CACHE_DIR: ${{ runner.temp }}/hcp-pinned-astra-cache/${{ matrix.release }}
        run: |
          python3 deployment/tests/verify_astra_vm.py \
            --release '${{ matrix.release }}' \
            --work-dir "$RUNNER_TEMP/hcp-astra-${{ matrix.release }}"
      - name: Save public scanner evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-vm-${{ matrix.release }}
          path: ${{ runner.temp }}/hcp-astra-${{ matrix.release }}/artifacts/
          retention-days: 14
          if-no-files-found: warn
