name: OpenSCAP full-profile acceptance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/openscap.yml
      - deployment/tests/verify_openscap.py
      - ansible/playbooks/openscap-audit.yml
      - ansible/scripts/hcp-controller-scan.py
      - ansible/tests/test_scanner_adapters.py
      - web/lib/openscap-policy.ts
      - web/lib/state-store.ts
      - web/lib/inventory.ts
      - web/tests/openscap-policy.test.mjs
      - web/tests/_typescript-loader.mjs
      - web/package.json
      - web/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openscap-full-profile-acceptance:
    # Full unmodified official profile plus a bounded permission violation.
    # Baseline findings are expected; scanner errors must remain partial.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SSG_VERSION: 0.1.79
      # Digest published by the official v0.1.79 GitHub release asset API.
      SSG_ARCHIVE_SHA256: 946718cf6f88e7a976d7e2b4f01ceaba6af9b18cace37d2c8bbffa8b205dd3e8
      ANSIBLE_FORCE_COLOR: "false"
      ANSIBLE_LOCALHOST_WARNING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies for the production exception handler
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Install the real scanner and Ansible on the disposable VM
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test "$(. /etc/os-release; printf '%s' "$ID:$VERSION_ID")" = "ubuntu:24.04"
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends ansible openscap-scanner python3-lxml
          mkdir -p "$RUNNER_TEMP/hcp-openscap/artifacts/reports"
          oscap --version > "$RUNNER_TEMP/hcp-openscap/artifacts/oscap-version.txt"
          ansible --version > "$RUNNER_TEMP/hcp-openscap/artifacts/ansible-version.txt"
          cp /etc/os-release "$RUNNER_TEMP/hcp-openscap/artifacts/os-release.txt"

      - name: Download and verify official ComplianceAsCode content
        timeout-minutes: 3
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 120 \
            "https://github.com/ComplianceAsCode/content/releases/download/v${SSG_VERSION}/scap-security-guide-${SSG_VERSION}.zip" \
            --output "$RUNNER_TEMP/hcp-openscap/ssg.zip"
          printf '%s  %s\n' "$SSG_ARCHIVE_SHA256" "$RUNNER_TEMP/hcp-openscap/ssg.zip" | sha256sum --check --strict
          /usr/bin/python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "hcp-openscap"
          with zipfile.ZipFile(root / "ssg.zip") as archive:
              names = [name for name in archive.namelist() if pathlib.PurePosixPath(name).name == "ssg-ubuntu2404-ds.xml"]
              assert len(names) == 1, f"Expected exactly one Ubuntu 24.04 datastream, got {names}"
              (root / "ssg-ubuntu2404-original-ds.xml").write_bytes(archive.read(names[0]))
          PY

      - name: Execute the full official profile and prove a controlled failure and restoration
        timeout-minutes: 40
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,SSG_VERSION,SSG_ARCHIVE_SHA256 \
            env "PATH=$PATH" /usr/bin/python3 deployment/tests/verify_openscap.py \
            --execute-on-disposable-runner --work-dir "$RUNNER_TEMP/hcp-openscap"

      - name: Always restore the original target permission
        if: always()
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            /usr/bin/python3 deployment/tests/verify_openscap.py \
            --execute-on-disposable-runner --cleanup --work-dir "$RUNNER_TEMP/hcp-openscap"

      - name: Restore CI artifact ownership after the privileged scan
        # The production exception handler deliberately writes reports as
        # 0600. Hand the disposable CI evidence back to the uploading runner;
        # do not relax production report permissions to make artifact upload work.
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/hcp-openscap/artifacts"; then
            sudo chown -R -- "$(id -u):$(id -g)" "$RUNNER_TEMP/hcp-openscap/artifacts"
          fi

      - name: Upload raw ARF, normalized reports, provenance and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openscap-full-profile-acceptance
          path: ${{ runner.temp }}/hcp-openscap/artifacts/
          if-no-files-found: warn
          retention-days: 14
