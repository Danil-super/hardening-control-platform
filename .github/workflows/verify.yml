name: Verify hardening platform

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit production and complete application dependency trees
        run: |
          npm audit --omit=dev --audit-level=high --no-fund
          npm audit --audit-level=high --no-fund
      - run: npm run typecheck
      - name: Install PDF renderer and Ansible regression dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-reportlab fonts-dejavu-core ansible-core
      - run: npm test
      - run: npm run build
      - run: npm run test:http
      - run: python3 -m unittest discover -s ../ansible/tests -v

  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ansible
      - run: sudo python3 -m unittest discover -s deployment/tests -v
      - run: |
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventory.example.ini "$playbook" --syntax-check
          done

  container:
    needs: [web, ansible]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag hardening-control-platform:test .

  lab:
    needs: [web, ansible]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: ./deployment/lab/up.sh
      - name: Enroll two real SSH hosts with separate keys
        run: python3 deployment/lab/verify-ssh-enrollment.py
      - name: Exercise real SSH, Ansible, Nmap, Lynis and Trivy
        run: python3 deployment/lab/verify.py --online --expect-cold-cache
      - name: Verify native Trivy detection and Ubuntu vendor backport matching
        run: bash deployment/lab/verify-trivy-matching.sh
      - name: Check temporary Lynis cleanup
        run: |
          docker compose -f deployment/lab/docker-compose.yml exec -T lab-target python3 -c 'import glob; assert not glob.glob("/tmp/hcp-lynis-*")'
      - name: Check persistent state after container restart
        run: |
          docker compose -f deployment/lab/docker-compose.yml restart hcp
          docker compose -f deployment/lab/docker-compose.yml up -d --wait --wait-timeout 180 hcp
          python3 deployment/lab/verify.py --check-persistence
          python3 deployment/lab/verify-ssh-enrollment.py --check-persistence
      - name: Restore disposable HCP into a second volume and verify auth, HMAC, report integrity and SSH
        run: python3 deployment/lab/verify-restored-controller.py
      - name: Save acceptance protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-verification
          path: |
            .lab/verification.json
            .lab/ssh-enrollment.json
            .lab/restore-verification.json
            .lab/reports/*.json
            .lab/trivy-matching-acceptance/
          if-no-files-found: warn
      - name: Show service logs on failure
        if: failure()
        run: docker compose -f deployment/lab/docker-compose.yml logs --no-color --tail=150
      - name: Stop lab
        if: always()
        run: |
          docker rm -f hcp-enrollment-target || true
          docker compose -f deployment/lab/docker-compose.yml down

  required:
    name: Required platform checks
    if: ${{ always() }}
    needs: [web, ansible, container, lab]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HCP_WEB_RESULT: ${{ needs.web.result }}
      HCP_ANSIBLE_RESULT: ${{ needs.ansible.result }}
      HCP_CONTAINER_RESULT: ${{ needs.container.result }}
      HCP_LAB_RESULT: ${{ needs.lab.result }}
    steps:
      - name: Require every platform job to succeed
        run: |
          set -euo pipefail
          for result in "$HCP_WEB_RESULT" "$HCP_ANSIBLE_RESULT" "$HCP_CONTAINER_RESULT" "$HCP_LAB_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::All platform jobs must succeed; failed, cancelled or skipped jobs cannot satisfy this gate."
              exit 1
            fi
          done
