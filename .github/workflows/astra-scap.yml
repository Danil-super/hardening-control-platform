name: HCP Astra baseline engine acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/astra-scap.yml
      - ansible/scap/astra/**
      - ansible/playbooks/openscap-audit.yml
      - ansible/scripts/hcp-controller-scan.py
      - ansible/tests/test_astra_scap.py
      - deployment/tests/verify_astra_scap.py
  pull_request:
    paths:
      - .github/workflows/astra-scap.yml
      - ansible/scap/astra/**
      - ansible/playbooks/openscap-audit.yml
      - ansible/scripts/hcp-controller-scan.py
      - ansible/tests/test_astra_scap.py
      - deployment/tests/verify_astra_scap.py

permissions:
  contents: read

jobs:
  real-openscap-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the real engine on the disposable Ubuntu VM
        run: |
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends ansible openscap-scanner
      - name: Verify baseline semantics
        run: python3 -m unittest discover -s ansible/tests -p test_astra_scap.py -v
      - name: Run real XCCDF validation and all rules through OVAL, SCE and the production playbook
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT \
            /usr/bin/python3 deployment/tests/verify_astra_scap.py \
            --work-dir "$RUNNER_TEMP/hcp-astra-baseline"
      - name: Restore evidence ownership for artifact upload
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/hcp-astra-baseline/artifacts"; then
            sudo chown -R -- "$(id -u):$(id -g)" "$RUNNER_TEMP/hcp-astra-baseline/artifacts"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcp-astra-baseline-engine-acceptance
          path: ${{ runner.temp }}/hcp-astra-baseline/artifacts/
          retention-days: 14
          if-no-files-found: warn

  real-python35:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual Python 3.5 execution of the unchanged SCE check
        run: |
          docker pull python:3.5.10-slim
          docker image inspect python:3.5.10-slim --format '{{index .RepoDigests 0}}' > python35-image.txt
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user 65534:65534 --memory 256m \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --env PYTHONDONTWRITEBYTECODE=1 --workdir /workspace \
            "$(cat python35-image.txt)" python -c \
            'import runpy; c=runpy.run_path("ansible/scap/astra/check.py"); assert c["evaluate"]("protected_hardlinks")[0] == 105; print("Python 3.5 real SCE module: non-Astra returns notapplicable")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcp-astra-baseline-python35
          path: python35-image.txt
          retention-days: 14
