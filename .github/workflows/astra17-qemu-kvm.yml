name: Native Astra SE 1.7.6.15 official QEMU image SSH smoke (exploratory)

on:
  pull_request:
    paths:
      - .github/workflows/astra17-qemu-kvm.yml
      - deployment/tests/verify_astra17_qemu_kvm.py
      - deployment/tests/test_astra17_qemu_kvm.py
      - deployment/tests/verify_astra_vm.py
      - deployment/tests/download_astra17_ova.py
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-astra17-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable QEMU and SSH dependencies
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -o Acquire::Retries=2
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils openssh-client sshpass
          if test -e /dev/kvm; then sudo chmod 0666 /dev/kvm; fi
      - name: Run strict offline pinned-source and native identity tests
        run: python3 -m unittest discover -s deployment/tests -p test_astra17_qemu_kvm.py -v
      - name: Boot pinned real Astra QEMU image and verify fresh SSH identity
        run: |
          python3 deployment/tests/verify_astra17_qemu_kvm.py \
            --work-dir "$RUNNER_TEMP/hcp-astra17-qemu-private" \
            --public-result "$RUNNER_TEMP/hcp-astra17-qemu-public.json"
      - name: Upload only limited native SSH observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra17-genuine-qemu-ssh-smoke
          path: ${{ runner.temp }}/hcp-astra17-qemu-public.json
          retention-days: 14
          if-no-files-found: warn
