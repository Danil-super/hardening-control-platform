[defaults]
inventory = ansible/inventory.ini
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
deprecation_warnings = False

[ssh_connection]
# HCP uses non-interactive sudo for every audit and remediation.  Pipelining
# sends a module through sudo's stdin and is not compatible with hardened
# targets that enforce terminal/PAM rules around privilege escalation.
pipelining = False
ssh_args = -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts

[privilege_escalation]
# Keep the runtime elevation contract explicit: HCP never prompts during an
# audit, and the one-time onboarding step must have prepared this exact mode.
become_method = sudo
become_user = root
become_flags = -H -S -n
